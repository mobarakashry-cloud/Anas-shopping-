name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Wait for Redis
        run: |
          sudo apt-get update -y
          sudo apt-get install -y redis-tools
          for i in {1..30}; do
            if redis-cli -h localhost ping | grep -q PONG; then
              echo "Redis is ready" && break
            fi
            echo "Waiting for Redis... ($i)"; sleep 1
          done

      - name: Run tests
        env:
          SESSION_SECRET: ci_test_secret
          REDIS_URL: redis://localhost:6379
          NEXT_PUBLIC_PI_MOCK: 1
        run: npm test -- --run
